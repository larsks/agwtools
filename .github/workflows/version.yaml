name: Version

on:
  workflow_call:
    outputs:
      published:
        value: ${{ jobs.version.outputs.published }}
      version:
        value: ${{ jobs.version.outputs.version }}
      major:
        value: ${{ jobs.version.outputs.major }}
      minor:
        value: ${{ jobs.version.outputs.minor }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      major: ${{ steps.semrel.outputs.new_release_major_version }}
      minor: ${{ steps.semrel.outputs.new_release_minor_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Release
        id: semrel
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
