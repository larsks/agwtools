name: Binaries

on:
  workflow_call:
    inputs:
      published:
        type: string
        default: "false"
      version:
        type: string
        default: ""

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ inputs.version || 'devel' }}
          COMMIT: ${{ github.sha }}
        run: make

      # Only attach binaries to the release when this run actually created one.
      - name: Upload release assets
        if: inputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ inputs.version }}" \
            agwlisten-linux-${{ matrix.goarch }} \
            agwconnect-linux-${{ matrix.goarch }} \
            --repo ${{ github.repository }}
